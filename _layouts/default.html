<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
  {%- seo -%}
  {%- feed_meta -%}
</head>
<body>
  <main class="wrap">
    <header class="site-header">
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
      <nav>
        <a href="{{ '/' | relative_url }}">Home</a> &nbsp;/&nbsp;
        <a href="{{ '/blog/' | relative_url }}">Blog</a> &nbsp;/&nbsp;
        <a href="{{ '/tags/' | relative_url }}">Tags</a>
      </nav>
    </header>

    {{ content }}

    <footer class="site-footer">
      &copy; {{ site.time | date: '%Y' }} {{ site.author.name }}
    </footer>
  </main>

  {%- if page.math -%}
    {% include mathjax.html %}
  {%- endif -%}
</body>
</html>
